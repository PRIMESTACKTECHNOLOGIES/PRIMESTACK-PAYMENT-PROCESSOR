plugins {
    id 'com.android.application'
}

android {
    namespace 'com.primestack.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.primestack.pos"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Override server URL at build time:
        //   ./gradlew assembleRelease -PserverUrl=https://your-server.com
        def serverUrl = project.findProperty("serverUrl") ?: "http://10.0.2.2:6001"
        buildConfigField "String", "SERVER_BASE_URL", "\"${serverUrl}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // ACS Smart Card SDK
    implementation files('../acssmc-1.1.7-android12-20240216/ReaderTest/app/libs/acssmc-1.1.7.aar')

    // AndroidX
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // HTTP client (bundled — no extra dependency needed for simple HTTP)
    // We use HttpURLConnection from the standard Android SDK

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
